services:
  alrifai:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 3000
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    networks:
      - existing_postgres
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  existing_postgres:
    external: true
    name: ${VPS_NETWORK:?Set the exact existing PostgreSQL Docker network in .env}
